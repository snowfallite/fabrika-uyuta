<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Фабрика Уюта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../dist/styles.css" />
</head>
<body>

<!--
  AuthLayout в исходниках не передавался — оболочка ниже восстановлена (карточка по центру,
  круглая иконка, заголовок, подзаголовок, footer). Button / Input / Label / InputOTP — стандартные
  стили shadcn/ui поверх токенов сайта.
-->
<div class="min-h-screen flex items-center justify-center bg-background px-4 py-10">
  <div class="w-full max-w-md">
    <div class="rounded-2xl border border-border bg-card p-8 shadow-sm">
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-4">
          <svg id="ico" class="w-6 h-6 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </div>
        <h1 id="ttl" class="font-heading text-3xl text-primary"></h1>
        <p id="sub" class="mt-1 text-sm text-muted-foreground"></p>
      </div>
      <div id="body"></div>
    </div>
    <p id="foot" class="mt-6 text-center text-sm text-muted-foreground"></p>
  </div>
</div>

<!-- Переключатель демо-экранов (только для просмотра кита) -->
<div class="fixed bottom-4 left-1/2 -translate-x-1/2 glass rounded-full px-2 py-1.5 flex gap-1 text-xs font-medium shadow-[0_18px_50px_-30px_rgba(44,44,44,0.5)]" id="switch"></div>

<script>
  // ---- shadcn-стили ----
  const BTN = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background disabled:pointer-events-none disabled:opacity-50 px-4 py-2';
  const BTN_P = BTN + ' bg-primary text-primary-foreground hover:bg-primary/90';
  const BTN_O = BTN + ' border border-input bg-background hover:bg-accent hover:text-accent-foreground';
  const INPUT = 'flex w-full rounded-md border border-input bg-background px-3 py-2 text-base placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background md:text-sm pl-10 h-12';
  const LABEL = 'text-sm font-medium leading-none';
  const ICON = {
    login: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
    user: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
    mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    shield: '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>'
  };
  const mailI = '<svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON.mail + '</svg>';
  const lockI = '<svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  const field = (id, label, type, ph, icon, extra='') => `
    <div class="space-y-2">${extra || `<label class="${LABEL}" for="${id}">${label}</label>`}
      <div class="relative">${icon}<input id="${id}" type="${type}" placeholder="${ph}" class="${INPUT}" /></div></div>`;
  const google = `
    <button class="${BTN_O} w-full h-12 text-sm font-medium mb-6">
      <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.4-4.7 3.4-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.4-1 7.2-2.7l-3.5-2.7c-1 .7-2.2 1-3.7 1-2.9 0-5.3-1.9-6.100-4.600H2.300v2.800A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.900 14c-.2-.7-.4-1.300-.4-2s.1-1.400.4-2V7.200H2.300a11 11 0 0 0 0 9.600z"/><path fill="#EA4335" d="M12 5.400c1.600 0 3.100.6 4.200 1.700l3.100-3.100A11 11 0 0 0 2.300 7.200L5.900 10c.8-2.600 3.200-4.600 6.100-4.600z"/></svg>
      Continue with Google</button>
    <div class="relative mb-6"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-border"></div></div>
      <div class="relative flex justify-center text-xs uppercase"><span class="bg-card px-3 text-muted-foreground">or</span></div></div>`;
  const a = (h, t) => `<a href="#${h}" class="text-primary font-medium hover:underline">${t}</a>`;
  const err = t => `<div class="mb-4 p-3 rounded-lg bg-destructive/10 text-destructive text-sm">${t}</div>`;

  const VIEWS = {
    login: { icon: 'login', title: 'Welcome back', sub: 'Log in to your account',
      foot: `Don't have an account? ${a('register','Create one')}`,
      body: `${google}${err('Invalid email or password')}
        <form class="space-y-4" onsubmit="return false">
          ${field('email','Email','email','you@example.com',mailI)}
          ${field('password','Password','password','••••••••',lockI,
            `<div class="flex items-center justify-between"><label class="${LABEL}" for="password">Password</label><a href="#forgot" class="text-xs text-primary hover:underline">Forgot password?</a></div>`)}
          <button class="${BTN_P} w-full h-12 font-medium">Log in</button>
        </form>` },
    register: { icon: 'user', title: 'Create your account', sub: 'Sign up to get started',
      foot: `Already have an account? ${a('login','Log in')}`,
      body: `${google}
        <form class="space-y-4" onsubmit="location.hash='otp';return false">
          ${field('email','Email','email','you@example.com',mailI)}
          ${field('password','Password','password','••••••••',lockI)}
          ${field('confirm','Confirm Password','password','••••••••',lockI)}
          <button class="${BTN_P} w-full h-12 font-medium">Create account</button>
        </form>` },
    otp: { icon: 'mail', title: 'Verify your email', sub: 'We sent a code to you@example.com', foot: '',
      body: `<div class="flex justify-center mb-6">${[0,1,2,3,4,5].map(i=>`<div class="relative flex h-10 w-10 items-center justify-center border-y border-r border-input text-sm first:rounded-l-md first:border-l last:rounded-r-md ${i===0?'ring-2 ring-ring ring-offset-background z-10':''}">${i<2?'4':''}</div>`).join('')}</div>
        <button class="${BTN_P} w-full h-12 font-medium opacity-50" disabled>Verify</button>
        <p class="text-center text-sm text-muted-foreground mt-4">Didn't receive the code? <button class="text-primary font-medium hover:underline">Resend</button></p>` },
    forgot: { icon: 'mail', title: 'Reset password', sub: "We'll send you a link to reset it",
      foot: `<a href="#login" class="text-primary font-medium hover:underline">← Back to log in</a>`,
      body: `<form class="space-y-4" onsubmit="return false">
          ${field('email2','Email address','email','you@example.com',mailI)}
          <button class="${BTN_P} w-full h-12 font-medium">Send reset link</button></form>` },
    consent: { icon: 'shield', title: 'Authorize access', sub: 'An AI client wants to access Фабрика Уюта on your behalf', foot: '',
      body: `<p class="text-sm font-medium text-foreground mb-2">It will be able to use these tools in Фабрика Уюта:</p>
        <ul class="space-y-2 text-sm mb-6">
          <li class="flex flex-col"><span class="text-foreground font-medium">Read leads</span><span class="text-muted-foreground">View incoming requests</span></li>
          <li class="flex flex-col"><span class="text-foreground font-medium">Edit gallery</span><span class="text-muted-foreground">Add and update gallery items</span></li>
        </ul>
        <div class="flex gap-3"><button class="${BTN_O} flex-1 h-12 font-medium">Deny</button><button class="${BTN_P} flex-1 h-12 font-medium">Approve</button></div>` },
  };
  const NAMES = { login: 'Вход', register: 'Регистрация', otp: 'Код', forgot: 'Сброс', consent: 'Consent' };

  function render() {
    const k = (location.hash || '#login').slice(1); const v = VIEWS[k] || VIEWS.login;
    document.getElementById('ico').innerHTML = ICON[v.icon];
    document.getElementById('ttl').textContent = v.title;
    document.getElementById('sub').textContent = v.sub;
    document.getElementById('body').innerHTML = v.body;
    document.getElementById('foot').innerHTML = v.foot;
    document.getElementById('switch').innerHTML = Object.keys(NAMES).map(n =>
      `<a href="#${n}" class="rounded-full px-3 py-1.5 ${n===k?'bg-primary text-primary-foreground':'text-foreground/75 hover:text-primary'}">${NAMES[n]}</a>`).join('');
  }
  window.addEventListener('hashchange', render); render();
</script>
</body>
</html>
