# Merge to main: build images, push to GHCR, deploy staging, smoke test (tech.md, 16.3).
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, STAGING_BASIC_AUTH (user:password).
# Variables: DOMAIN.
name: deploy-staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/fabrika-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/fabrika-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy deploy/
        run: rsync -az --delete deploy/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/fabrika/app/deploy/"
      - name: Deploy
        run: >
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          "GHCR_OWNER=${{ steps.owner.outputs.name }} /opt/fabrika/app/deploy/deploy.sh staging ${{ github.sha }}"
      - name: Smoke
        env:
          SMOKE_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: deploy/smoke.sh "https://stage.${{ vars.DOMAIN }}"
