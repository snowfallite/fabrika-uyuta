# Dev stack: Postgres and Django. Frontend runs on the host: pnpm -C frontend dev.
services:
  db:
    image: postgres:18
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 keeps PGDATA in /var/lib/postgresql/18/docker (tech.md, section 4).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    command: sh -c "uv sync --frozen --no-dev && uv run --no-sync python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      # Keep the Linux venv out of the bind-mounted backend/ folder.
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - venv:/venv
      - uv-cache:/root/.cache/uv
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  venv:
  uv-cache:
