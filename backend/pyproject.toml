[project]
name = "fabrika-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-axes>=8.3.1",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.30.0",
    "google-auth>=2.58.1",
    "gunicorn>=26.2.0",
    "phonenumberslite>=9.0.40",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs>=5.2,<5.3",
    "djangorestframework-stubs>=3.16,<3.17",
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-socket>=0.8.1",
    "responses>=0.26.3",
    "ruff>=0.16.9",
    "schemathesis>=4.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF"]
# RUF001-003: Russian UI texts are not homoglyph attacks.
# RUF012: Django Meta and admin options are declarative lists by design.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"conftest.py" = ["S101"]

[tool.mypy]
strict = true
files = ["apps", "config", "conftest.py"]
exclude = ["/migrations/"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
# DRF serializers and Django admin classes are generic only in the stubs; subscripting them at
# runtime needs django_stubs_ext, which production images do not ship.
module = ["apps.*.admin", "apps.*.api.serializers", "apps.core.serializers", "apps.*.tests.*"]
disallow_any_generics = false

[[tool.mypy.overrides]]
# drf-spectacular and Schemathesis helpers used by contract tests have no type hints.
module = ["apps.*.tests.*"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# Tests reach only the local Postgres (tech.md, section 17).
addopts = "--allow-hosts=127.0.0.1,::1 --strict-markers"
testpaths = ["apps"]
filterwarnings = ["ignore:No directory at:UserWarning"]
